{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение входа</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center">Подтверждение входа</h2>
        <form>
            <div class="form-group">
                <label for="code">Введите код подтверждения (4 знака)</label>
                <input type="text" class="form-control" id="code" maxlength="4" placeholder="XXXX" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Подтвердить</button>
            <li><a href="{% url 'users:home' %}" class="text-white">Подтвердить</a></li>
        </form>
        <div class="mt-3 text-center">
            <small>Не получили код? <a href="#">Отправить повторно</a></small>
        </div>
    </div>
</body>
</html>
